[versions]
# -- Build Config --
minSdk = "28"
compileSdk = "37"
# Libraries carry no targetSdk of their own since AGP 9; they lint against this level and the sample app targets it.
targetSdk = "37"
# Stamped into every published AAR. AGP 9 would otherwise stamp compileSdk, forcing partner apps to 37
# while Play asks for 36 today.
minCompileSdk = "36"

# -- Project --
rain-sdk = "1.0.1"

# -- Plugins --
android-gradle-plugin = "9.4.0"
# Consumers need Kotlin 2.1 or newer to read our metadata (one language release back), the same floor
# Turnkey already sets. 2.3 would move partners to 2.2 and 2.4 to 2.3; revisit after launch.
kotlin = "2.2.21"
dokka = "2.2.0"
maven-publish = "0.37.0"
# The 2.0 line (group dev.detekt) is the first detekt that understands AGP's built-in Kotlin. Pre-release,
# so pinned exactly.
detekt = "2.0.0-alpha.6"

# -- Core SDK Dependencies --
portal-android = "9.2.0"
turnkey = "2.0.1"
# sdk-kotlin 2.0.1 declares http and types at 2.1.0; they no longer share its version number.
turnkey-http-types = "2.1.0"
# com.turnkey:crypto is versioned separately from sdk-kotlin, whose metadata requires this value
# without pinning it, so a bump here would win: move it together with the sdk-kotlin version.
turnkey-crypto = "1.0.1"
# com.turnkey:passkey and com.turnkey:stamper are versioned apart from sdk-kotlin as well; the adapter
# runs the passkey ceremony and matches their error types directly, so both are named.
turnkey-passkey-stamper = "1.0.3"
privy = "0.15.0"
# Security: pin Turnkey transitive deps above CVE-affected versions.
# bitcoinj < 0.17.1 = GHSA-hfcf-v2f8-x9pc (P2PKH/P2WPKH verify bypass).
# protobuf-javalite < 3.25.5 = GHSA-735f-pc8j-v9w8 (DoS).
# bcprov-jdk15to18 is the single BC artifact on the classpath (bcprov-jdk18on is excluded
# project-wide); floor it explicitly rather than relying on bitcoinj to drag it past 1.82.
# < 1.84 = GHSA-574f-3g2m-x479 (GOST 28147 CTR keystream reuse, critical).
bitcoinj = "0.17.1"
# Floor only: bitcoinj 0.17.1 already resolves protobuf-javalite to 4.33.4; this documents the GHSA minimum.
protobuf-javalite = "3.25.9"
bouncycastle = "1.86"
# Ceiling. 4.10.x is the line exercised on devices; later lines change the class-file level and the Jackson
# major, so verify on a device before moving.
web3j = "4.10.3"
timber = "5.0.1"
# Ceiling. 5.5.0's Android artifact declares minCompileSdk 37, which every partner app would inherit.
okhttp = "5.4.0"

# -- Kotlin --
coroutines = "1.11.0"
# Ceiling while the compiler is 2.2: 1.10 and later are built with Kotlin 2.3 and put stdlib 2.3 on the classpath.
kotlinx-serialization = "1.9.0"

# -- Tooling --
zxing = "3.5.4"

# -- AndroidX & Compose --
androidx-annotation = "1.10.0"
androidx-core-ktx = "1.18.0"
androidx-lifecycle = "2.10.0"
androidx-activity-compose = "1.13.0"
androidx-compose-bom = "2026.06.01"
androidx-navigation-compose = "2.9.8"
androidx-security-crypto = "1.1.0"
# The version com.turnkey:passkey 1.0.3 resolves, so no consumer sees a change; 1.6.0 adds a
# minAndroidGradlePluginVersion 8.6.0 floor that 1.5.0 does not carry.
androidx-credentials = "1.5.0"

# -- Testing --
junit = "4.13.2"
androidx-junit = "1.3.0"
androidx-espresso = "3.7.0"
mockk = "1.14.11"
truth = "1.4.5"
json = "20260814"
# Test-only reference implementation for Solana transaction/address encoding. Never shipped —
# see the `testImplementation` note in rain-core-android/build.gradle.kts.
sol4k = "0.8.2"
sol4k-tweetnacl = "0.1.6"

[libraries]
# -- Build Tools --
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# -- Rain SDK Core --
portal-android = { module = "io.portalhq.android:portal-android", version.ref = "portal-android" }
turnkey-sdk-kotlin = { module = "com.turnkey:sdk-kotlin", version.ref = "turnkey" }
turnkey-http = { module = "com.turnkey:http", version.ref = "turnkey-http-types" }
turnkey-types = { module = "com.turnkey:types", version.ref = "turnkey-http-types" }
# Declared so the module names what it imports. sdk-kotlin already carries it transitively.
turnkey-crypto = { module = "com.turnkey:crypto", version.ref = "turnkey-crypto" }
turnkey-passkey = { module = "com.turnkey:passkey", version.ref = "turnkey-passkey-stamper" }
turnkey-stamper = { module = "com.turnkey:stamper", version.ref = "turnkey-passkey-stamper" }
# Pulls Privy's KMP model artifacts (kmp-embedded-wallet-public / kmp-authentication-public) transitively.
privy-core = { module = "io.privy:privy-core", version.ref = "privy" }
web3j-core = { module = "org.web3j:core", version.ref = "web3j" }
# Security pins (CVE patches) for Turnkey transitive deps.
bitcoinj-core = { module = "org.bitcoinj:bitcoinj-core", version.ref = "bitcoinj" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-javalite" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
json = { module = "org.json:json", version.ref = "json" }

# -- Kotlin --
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# -- AndroidX --
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

# -- Compose (Managed by BOM) --
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation-compose" }

# -- Static analysis --
# ktlint formatting rules wrapped as a detekt ruleset (loaded via detektPlugins).
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }

# -- Testing --
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
sol4k = { module = "org.sol4k:sol4k", version.ref = "sol4k" }
# sol4k's ed25519 primitives — runtime-scoped in its POM, so declared explicitly for the
# curve-membership assertions in SolanaAddressesTest.
sol4k-tweetnacl = { module = "org.sol4k:tweetnacl", version.ref = "sol4k-tweetnacl" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
