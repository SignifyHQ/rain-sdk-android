android.useAndroidX=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Task outputs are cached and independent modules build in parallel. In CI the cache is written by
# runs on main and read by pull requests, so a PR that touches one module does not recompile the
# other five in every job.
org.gradle.caching=true
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
